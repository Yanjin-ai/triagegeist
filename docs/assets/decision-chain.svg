<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="360" rx="14" fill="#0f1419"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="700">A supervisable decision — every prediction shows its chain</text>

  <!-- step boxes row 1 -->
  <g font-size="11.5">
    <g>
      <rect x="32" y="64" width="150" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="44" y="84" fill="#4aa3ff" font-weight="700">1 · intake</text>
      <text x="44" y="104" fill="#cfd8e3">features provided/imputed</text>
    </g>
    <g>
      <rect x="202" y="64" width="156" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="214" y="84" fill="#4aa3ff" font-weight="700">2 · data processing</text>
      <text x="214" y="104" fill="#cfd8e3">sentinel flag · no leakage</text>
    </g>
    <g>
      <rect x="378" y="64" width="150" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="390" y="84" fill="#3ecf8e" font-weight="700">3 · model</text>
      <text x="390" y="104" fill="#cfd8e3">text-blind acuity dist</text>
    </g>
    <g>
      <rect x="548" y="64" width="150" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="560" y="84" fill="#f5c518" font-weight="700">4 · calibration</text>
      <text x="560" y="104" fill="#cfd8e3">isotonic · ECE ≈ 0.012</text>
    </g>
    <g>
      <rect x="718" y="64" width="170" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="730" y="84" fill="#f5c518" font-weight="700">5 · conformal set</text>
      <text x="730" y="104" fill="#cfd8e3">coverage guarantee</text>
    </g>
  </g>
  <!-- arrows row1 -->
  <g stroke="#4a5663" stroke-width="2" fill="none">
    <path d="M182 93 H202"/><path d="M358 93 H378"/><path d="M528 93 H548"/><path d="M698 93 H718"/>
  </g>

  <!-- step boxes row 2 -->
  <g font-size="11.5">
    <g>
      <rect x="32" y="150" width="150" height="58" rx="9" fill="#1a1414" stroke="#5c2525"/>
      <text x="44" y="170" fill="#ff8c3b" font-weight="700">6 · safety override</text>
      <text x="44" y="190" fill="#cfd8e3">caps ESI ≤ 3 if high-risk</text>
    </g>
    <g>
      <rect x="202" y="150" width="156" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="214" y="170" fill="#ff8c3b" font-weight="700">7 · resource map</text>
      <text x="214" y="190" fill="#cfd8e3">operational bucket</text>
    </g>
    <g>
      <rect x="378" y="150" width="150" height="58" rx="9" fill="#161c24" stroke="#2a3441"/>
      <text x="390" y="170" fill="#ff8c3b" font-weight="700">8 · priority</text>
      <text x="390" y="190" fill="#cfd8e3">transparent score</text>
    </g>
    <g>
      <rect x="548" y="150" width="340" height="58" rx="9" fill="#13202e" stroke="#25415c"/>
      <text x="560" y="170" fill="#4aa3ff" font-weight="700">9 · disposition</text>
      <text x="560" y="190" fill="#cfd8e3">auto-suggest (clinician confirms)  —or—  DEFER to human</text>
    </g>
  </g>
  <!-- arrow wrap -->
  <g stroke="#4a5663" stroke-width="2" fill="none">
    <path d="M803 122 V136 H107 V150"/>
    <path d="M182 179 H202"/><path d="M358 179 H378"/><path d="M528 179 H548"/>
  </g>

  <!-- oversight row -->
  <text x="32" y="246" fill="#8b98a8" font-size="13" font-weight="700">MULTI-PARTY OVERSIGHT  (triggered by evidence, written to an audit log)</text>
  <g font-weight="700">
    <rect x="32" y="258" width="200" height="42" rx="8" fill="#1a1414" stroke="#ff8c3b"/>
    <text x="46" y="276" fill="#ff8c3b" font-size="12">Triage nurse · REQUIRED</text><text x="46" y="292" fill="#8b98a8" font-size="10.5" font-weight="400">confirm or override</text>
    <rect x="244" y="258" width="220" height="42" rx="8" fill="#1a1414" stroke="#ff8c3b"/>
    <text x="258" y="276" fill="#ff8c3b" font-size="12">Senior physician</text><text x="258" y="292" fill="#8b98a8" font-size="10.5" font-weight="400">if deferred / critical · co-sign</text>
    <rect x="476" y="258" width="210" height="42" rx="8" fill="#161c24" stroke="#2a3441"/>
    <text x="490" y="276" fill="#cfd8e3" font-size="12">Equity auditor</text><text x="490" y="292" fill="#8b98a8" font-size="10.5" font-weight="400">flagged subgroup · monitor</text>
    <rect x="698" y="258" width="190" height="42" rx="8" fill="#161c24" stroke="#2a3441"/>
    <text x="712" y="276" fill="#cfd8e3" font-size="12">Operations</text><text x="712" y="292" fill="#8b98a8" font-size="10.5" font-weight="400">bed impact · capacity</text>
  </g>

  <rect x="32" y="312" width="856" height="30" rx="8" fill="#13202e" stroke="#25415c"/>
  <text x="46" y="332" fill="#8b98a8" font-size="11.5">AUDIT LOG (append-only): model suggestion + every human action with reason — accountability for who decided what.</text>
</svg>
