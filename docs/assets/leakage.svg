<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="340" rx="14" fill="#0f1419"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="700">The central finding: the label is encoded in the complaint text</text>

  <!-- mapping -->
  <rect x="32" y="66" width="300" height="46" rx="9" fill="#161c24" stroke="#2a3441"/>
  <text x="46" y="94" fill="#cfd8e3" font-size="13">“necrotising fasciitis, rapid spread”</text>
  <path d="M338 89 H392" stroke="#4a5663" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="398" y="66" width="120" height="46" rx="9" fill="#1a1414" stroke="#5c2525"/>
  <text x="430" y="95" fill="#ff4d4f" font-size="16" font-weight="700">ESI 1</text>

  <rect x="32" y="122" width="300" height="46" rx="9" fill="#161c24" stroke="#2a3441"/>
  <text x="46" y="150" fill="#cfd8e3" font-size="13">“general health question, intermittent”</text>
  <path d="M338 145 H392" stroke="#4a5663" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="398" y="122" width="120" height="46" rx="9" fill="#1c2620" stroke="#1f5235"/>
  <text x="430" y="151" fill="#7d8794" font-size="16" font-weight="700">ESI 5</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a5663"/></marker></defs>

  <!-- stats -->
  <rect x="560" y="66" width="328" height="102" rx="10" fill="#13202e" stroke="#25415c"/>
  <text x="578" y="92" fill="#4aa3ff" font-size="12" font-weight="700">DATA-GENERATING PROPERTY</text>
  <text x="578" y="118" fill="#e6edf3" font-size="14"><tspan font-weight="700" fill="#3ecf8e">99.7%</tspan> of phrases → exactly one acuity</text>
  <text x="578" y="140" fill="#e6edf3" font-size="14"><tspan font-weight="700" fill="#3ecf8e">99.8%</tspan> of test phrases seen verbatim in train</text>
  <text x="578" y="160" fill="#8b98a8" font-size="12">→ the leaderboard is effectively a lookup table</text>

  <!-- two models -->
  <text x="32" y="208" fill="#8b98a8" font-size="13" font-weight="700">CONSEQUENCE — two models, one honest choice</text>

  <rect x="32" y="222" width="416" height="92" rx="10" fill="#161c24" stroke="#5c2525"/>
  <text x="48" y="246" fill="#ff8c3b" font-size="13" font-weight="700">Text / fusion model</text>
  <text x="48" y="268" fill="#cfd8e3" font-size="12">QWK ≈ 1.00 — but only re-learns the lookup</text>
  <rect x="48" y="280" width="384" height="14" rx="7" fill="#0f1419"/><rect x="48" y="280" width="382" height="14" rx="7" fill="#ff8c3b"/>
  <text x="48" y="306" fill="#8b98a8" font-size="11">shown only as a dataset insight — excluded from decisions</text>

  <rect x="472" y="222" width="416" height="92" rx="10" fill="#161c24" stroke="#1f5235"/>
  <text x="488" y="246" fill="#3ecf8e" font-size="13" font-weight="700">Text-blind structured model (our core)</text>
  <text x="488" y="268" fill="#cfd8e3" font-size="12">QWK ≈ 0.93 — physiology only, clinically meaningful</text>
  <rect x="488" y="280" width="384" height="14" rx="7" fill="#0f1419"/><rect x="488" y="280" width="356" height="14" rx="7" fill="#3ecf8e"/>
  <text x="488" y="306" fill="#8b98a8" font-size="11">the basis for calibration · conformal · fairness · operations</text>
</svg>
