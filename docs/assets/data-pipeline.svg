<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a5663"/></marker></defs>
  <rect width="960" height="380" rx="14" fill="#0f1419"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="700">Data processing — leakage-safe, serving-consistent</text>

  <!-- 4 source tables -->
  <g font-size="12">
    <rect x="32" y="64" width="170" height="40" rx="8" fill="#161c24" stroke="#2a3441"/><text x="46" y="89" fill="#cfd8e3">train / test (intake)</text>
    <rect x="32" y="112" width="170" height="40" rx="8" fill="#161c24" stroke="#2a3441"/><text x="46" y="137" fill="#cfd8e3">chief_complaints (text)</text>
    <rect x="32" y="160" width="170" height="40" rx="8" fill="#161c24" stroke="#2a3441"/><text x="46" y="185" fill="#cfd8e3">patient_history (25 hx)</text>
    <rect x="32" y="208" width="170" height="40" rx="8" fill="#161c24" stroke="#2a3441"/><text x="46" y="233" fill="#cfd8e3">disposition / LOS</text>
    <text x="46" y="252" fill="#ff8c3b" font-size="10.5">↑ train-only · never a feature</text>
  </g>

  <!-- join -->
  <path d="M202 84 H250" stroke="#4a5663" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M202 132 H250" stroke="#4a5663" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M202 180 H250" stroke="#4a5663" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="252" y="96" width="150" height="92" rx="9" fill="#13202e" stroke="#25415c"/>
  <text x="268" y="124" fill="#4aa3ff" font-size="13" font-weight="700">JOIN</text>
  <text x="268" y="146" fill="#cfd8e3" font-size="11.5">on patient_id</text>
  <text x="268" y="166" fill="#8b98a8" font-size="11">per-visit unique →</text>
  <text x="268" y="180" fill="#8b98a8" font-size="11">no train/test overlap</text>

  <!-- transform -->
  <path d="M402 142 H452" stroke="#4a5663" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="454" y="80" width="230" height="180" rx="10" fill="#161c24" stroke="#2a3441"/>
  <text x="470" y="106" fill="#3ecf8e" font-size="13" font-weight="700">FEATURE TRANSFORM</text>
  <text x="470" y="130" fill="#cfd8e3" font-size="11.5">• pain_score −1 → NaN + flag</text>
  <text x="470" y="150" fill="#cfd8e3" font-size="11.5">• co-missing BP indicator</text>
  <text x="470" y="170" fill="#cfd8e3" font-size="11.5">• grouped comorbidity counts</text>
  <text x="470" y="190" fill="#cfd8e3" font-size="11.5">• categoricals encoded</text>
  <text x="470" y="210" fill="#cfd8e3" font-size="11.5">• raw complaint text dropped</text>
  <rect x="470" y="222" width="198" height="26" rx="6" fill="#13351f" stroke="#1f5235"/>
  <text x="480" y="240" fill="#3ecf8e" font-size="11">one transform: train == serve</text>

  <!-- split -->
  <path d="M684 170 H734" stroke="#4a5663" stroke-width="2" marker-end="url(#ar)"/>
  <g font-size="12" font-weight="700">
    <rect x="736" y="96" width="190" height="34" rx="8" fill="#161c24" stroke="#2a3441"/><text x="750" y="118" fill="#cfd8e3">train (stratified)</text>
    <rect x="736" y="136" width="190" height="34" rx="8" fill="#161c24" stroke="#2a3441"/><text x="750" y="158" fill="#cfd8e3">val (calib + eval)</text>
    <rect x="736" y="176" width="190" height="34" rx="8" fill="#161c24" stroke="#2a3441"/><text x="750" y="198" fill="#cfd8e3">test (holdout)</text>
  </g>

  <!-- guarantees footer -->
  <rect x="32" y="296" width="894" height="58" rx="10" fill="#13202e" stroke="#25415c"/>
  <text x="48" y="320" fill="#4aa3ff" font-size="12" font-weight="700">GUARANTEES (unit-tested)</text>
  <text x="48" y="342" fill="#cfd8e3" font-size="12">no outcome leakage in features  ·  deterministic transform (no train/serve skew)  ·  sentinel recoded  ·  stratified split is leakage-safe</text>
</svg>
